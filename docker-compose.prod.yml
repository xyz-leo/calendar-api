# Production-only overlay on top of docker-compose.yml — merged in via:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file is untouched and still works standalone for local dev
# (plain `docker compose up`) — this file only adds what's needed to sit
# behind furikaeri's shared Caddy instance on the VPS, same pattern as
# that project's own learningsea-web: joins the external `shared_proxy`
# network under a fixed container_name, since Caddy reaches it directly
# over that network rather than through any published host port.
#
# `shared_proxy` must already exist on the host (it does — created once
# when learningsea.xyz was onboarded the same way): `docker network create
# shared_proxy` is not something this file or project should ever run.
services:
  api:
    container_name: calendar-api
    networks:
      - default
      - shared_proxy

networks:
  shared_proxy:
    external: true
