# Production. `docker compose up --build -d` — no -f flag needed, this is the
# plain default. For local dev instead, use docker-compose.dev.yml explicitly:
# `docker compose -f docker-compose.dev.yml up --build`.
services:
  api:
    build: .
    # Fixed name, not the default "calendar-api-api-1" — this is the exact
    # name the reverse proxy targets (`reverse_proxy calendar-api:8000`)
    # over the `proxy` network below. Also avoids any clash with another
    # project's same-named service sharing that network.
    #
    # No published ports: the reverse proxy is the only way in. To poke at
    # it from the VPS itself, go through the public URL, or
    # `docker compose exec api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').read())"`.
    container_name: calendar-api
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./data:/app/data
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    restart: unless-stopped
    networks:
      - default
      - proxy

# Created once, by hand, on the VPS (docker network create proxy) — this
# file only ever attaches to it, never creates or owns it. The reverse
# proxy container joins the same network.
networks:
  proxy:
    external: true
